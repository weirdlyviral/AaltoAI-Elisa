[browser]
gatherUsageStats = false

[theme]
base = "light"
# Streamlit cannot read CSS variables: these four repeat tokens.css (--accent,
# --bg, --panel, --fg). tests/test_palette.py fails if they drift.
primaryColor = "#00239d"
backgroundColor = "#fdfdfd"
secondaryBackgroundColor = "#f0f7ff"
textColor = "#101221"
font = "sans serif"

[client]
toolbarMode = "minimal"

[server]
headless = true
